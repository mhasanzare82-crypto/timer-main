name: Build Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/daily-reminders
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      # The user's target device is ARM64. Build only that ABI to avoid bundling
      # native libraries for x86/x86_64/armeabi-v7a in the installable release APK.
      - name: Build optimized ARM64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Report APK size
        run: |
          ls -lh build/app/outputs/flutter-apk/
          du -h build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: timer-main-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timer-main-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
